name: Publicar código fuente legible
on:
  push:
    paths:
      - '.github/workflows/publicar-fuentes.yml'
  workflow_dispatch:
jobs:
  descomprimir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extraer código Android
        run: |
          base64 --decode source/hojas-core.tar.xz.b64 | tar -xJf -
          test -f app/src/main/java/com/lecturas/hojas/MainActivity.java
      - name: Guardar fuentes en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle settings.gradle gradle.properties .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Publicar proyecto Android completo en carpetas legibles"
            git push origin HEAD:main
          fi
