name: Hojas 1.8 — APK biblioteca con paletas
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generar-apk:
    name: Compilar Hojas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar biblioteca con paletas y base estable
        run: gradle --no-daemon --stacktrace :app:assembleTemasDebug :app:assembleEstableDebug
      - name: Publicar APK de prueba independiente
        uses: actions/upload-artifact@v4
        with:
          name: Hojas-1.8-Biblioteca-Paletas-Prueba
          path: app/build/outputs/apk/temas/debug/app-temas-debug.apk
          if-no-files-found: error
      - name: Publicar base para la versión estable
        uses: actions/upload-artifact@v4
        with:
          name: Hojas-1.8-Base-Estable-Sin-Firma-Permanente
          path: app/build/outputs/apk/estable/debug/app-estable-debug.apk
          if-no-files-found: error
