name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generar-apk:
    name: Compilar Hojas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Comprobar archivos Android
        run: |
          test -f app/src/main/java/com/lecturas/hojas/MainActivity.java
          test -f app/src/main/java/com/lecturas/hojas/PageCurlView.java

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar plataforma Android 35
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Crear APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Hojas-Lector-PDF-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
