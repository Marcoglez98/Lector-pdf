name: Hojas APK estable firmado (actualizable)
on:
  workflow_dispatch:

jobs:
  firmar-actualizacion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOJAS_SIGNING_PASSWORD: ${{ secrets.HOJAS_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar secreto de firma
        shell: bash
        run: |
          if [ -z "$HOJAS_SIGNING_PASSWORD" ]; then
            echo "::error::Falta el secreto HOJAS_SIGNING_PASSWORD. Agrégalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Restaurar clave de firma privada cifrada
        shell: bash
        run: |
          base64 -d signing/hojas-stable-signing.enc.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:HOJAS_SIGNING_PASSWORD -out signing/hojas-estable.p12
          chmod 600 signing/hojas-estable.p12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK final con firma permanente
        run: gradle --no-daemon :app:assembleEstableRelease
      - name: Verificar certificado del APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/estable/release/app-estable-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/apk-certificate.txt
          grep -qi "cb849c052bd37a589d37e23cb580185c249fce172cf4ed7797c828ead347163a" /tmp/apk-certificate.txt || { echo "::error::La firma no corresponde a Hojas Estable"; exit 1; }
      - name: Subir instalador actualizable
        uses: actions/upload-artifact@v4
        with:
          name: Hojas-Estable-APK-Firmado
          path: app/build/outputs/apk/estable/release/app-estable-release.apk
          if-no-files-found: error
      - name: Borrar clave temporal del ejecutor
        if: always()
        run: rm -f signing/hojas-estable.p12
