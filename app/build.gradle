plugins { id 'com.android.application' }

android {
    namespace 'com.lecturas.hojas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lecturas.hojas'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
    }
    flavorDimensions 'distribucion'
    productFlavors {
        principal {
            dimension 'distribucion'
            manifestPlaceholders = [hojasName: 'Hojas · Lector PDF']
        }
        prueba {
            dimension 'distribucion'
            applicationIdSuffix '.libroreal'
            versionNameSuffix '-prueba'
            manifestPlaceholders = [hojasName: 'Hojas Libro Real']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES'] }
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
