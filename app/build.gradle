plugins { id 'com.android.application' }

android {
    namespace 'com.lecturas.hojas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lecturas.hojas'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '1.8.0'
    }
    signingConfigs {
        hojasPermanente {
            // El workflow descifra temporalmente la clave; nunca se publica.
            storeFile file('../signing/hojas-estable.p12')
            storePassword System.getenv('HOJAS_SIGNING_PASSWORD') ?: ''
            keyAlias 'hojas'
            keyPassword System.getenv('HOJAS_SIGNING_PASSWORD') ?: ''
        }
    }
    flavorDimensions 'distribucion'
    productFlavors {
        principal {
            dimension 'distribucion'
            manifestPlaceholders = [hojasName: 'Hojas · Lector PDF']
        }
        prueba {
            dimension 'distribucion'
            applicationIdSuffix '.cintaviva'
            versionNameSuffix '-prueba'
            manifestPlaceholders = [hojasName: 'Hojas Cinta Viva']
        }
        neon {
            dimension 'distribucion'
            applicationIdSuffix '.neon'
            versionNameSuffix '-neon-prueba'
            manifestPlaceholders = [hojasName: 'Hojas Neón Literario']
        }
        temas {
            dimension 'distribucion'
            applicationIdSuffix '.temas'
            versionNameSuffix '-temas-prueba'
            manifestPlaceholders = [hojasName: 'Hojas · Paletas']
        }
        estable {
            dimension 'distribucion'
            applicationIdSuffix '.estable'
            versionNameSuffix '-estable'
            manifestPlaceholders = [hojasName: 'Hojas Estable']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            signingConfig signingConfigs.hojasPermanente
        }
    }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES'] }
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
